[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-trajectory-debugger"
version = "0.1.0"
description = "Trace, analyze, and replay multi-step agent runs: timeline, cost rollup, retry loops, stuck loops, failure propagation"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["fastapi>=0.109", "uvicorn[standard]>=0.27"]

[project.scripts]
atd = "atd.cli:main"

[tool.setuptools.packages.find]
include = ["atd*"]

[tool.setuptools.package-data]
atd = ["static/*"]
